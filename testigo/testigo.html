<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Testigo — Signups</title>
  <style>
    body {
      margin: 0; min-height: 100vh; display: flex; flex-direction: column;
      align-items: center; justify-content: center; gap: 32px; padding: 24px;
      font-family: system-ui, sans-serif; background: #f6f6f4; color: #222; text-align: center;
    }
    button {
      font: inherit; font-size: 20px; font-weight: 600; padding: 16px 32px;
      border: 0; border-radius: 10px; background: #222; color: #fff; cursor: pointer;
    }
    button:disabled { opacity: .5; cursor: wait; }
    #verdict { font-size: 72px; font-weight: 800; letter-spacing: 2px; min-height: 86px; }
    #verdict.ok  { color: #128a3a; }
    #verdict.bad { color: #c62020; }
    #detail { font-size: 18px; max-width: 640px; white-space: pre-wrap; word-break: break-word; }
  </style>
</head>
<body>
  <button id="insert">Insertar Signup</button>
  <div id="verdict" role="status"></div>
  <div id="detail"></div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script>
    // Standalone witness page: talks to Supabase as an anonymous visitor would.
    const SUPABASE_URL = 'https://vfxpfbtifmgblitdqkrg.supabase.co';
    const SUPABASE_KEY = 'sb_publishable_0B7d_JrXvdWweF8m-Jid7w_hm5m3Crl';
    const EMAIL = 'testigo@prueba.com';

    const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY, {
      auth: { persistSession: false },
    });

    const button = document.getElementById('insert');
    const verdict = document.getElementById('verdict');
    const detail = document.getElementById('detail');

    button.addEventListener('click', async () => {
      button.disabled = true;
      verdict.className = '';
      verdict.textContent = '';
      detail.textContent = 'Enviando…';

      let error;
      try {
        // No .select(): anon can insert but not read, so asking for the row back would fail.
        ({ error } = await sb.from('signups').insert({ email: EMAIL }));
      } catch (e) {
        error = e;
      }

      if (error) {
        verdict.className = 'bad';
        verdict.textContent = 'RECHAZADA';
        detail.textContent = [error.code, error.message, error.details, error.hint]
          .filter(Boolean).join(' — ');
      } else {
        verdict.className = 'ok';
        verdict.textContent = 'ACEPTADA';
        detail.textContent = 'La base guardó la fila: ' + EMAIL;
      }
      button.disabled = false;
    });
  </script>
</body>
</html>
