<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="robots" content="noindex, nofollow" />
  <title>Admin — Paraíso Tropical Knowledge Hub</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body class="admin">

  <header class="admin__bar">
    <div class="container pad-x admin__bar-inner">
      <span class="nav__logo">
        <span class="mark" aria-hidden="true"></span>
        <span>Paraíso Tropical<small>Knowledge Hub · Admin</small></span>
      </span>
      <div class="admin__user" id="user-box" hidden>
        <span id="user-email"></span>
        <button class="btn btn--outline" id="sign-out" type="button">Sign out</button>
      </div>
    </div>
  </header>

  <main class="container pad-x admin__main">
    <!-- Shown when signed out -->
    <section id="login" class="admin__login" hidden>
      <h1 class="h3">Sign in</h1>
      <p class="admin__muted">Admin access only.</p>
      <form class="form" id="login-form" novalidate>
        <div class="form__field">
          <label class="form__label" for="login-email">Email</label>
          <input class="form__input" id="login-email" name="email" type="email" autocomplete="username" required />
        </div>
        <div class="form__field">
          <label class="form__label" for="login-password">Password</label>
          <input class="form__input" id="login-password" name="password" type="password" autocomplete="current-password" required />
        </div>
        <button class="btn btn--primary" type="submit">Sign in</button>
        <p class="form__status" role="status" aria-live="polite"></p>
      </form>
    </section>

    <!-- Filled only while signed in; emptied on sign-out -->
    <div id="dashboard" hidden></div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="config.js"></script>
  <script>
    const sb = window.supabase.createClient(SUPABASE_CONFIG.url, SUPABASE_CONFIG.key);
    const $ = (id) => document.getElementById(id);
    const loginView = $('login'), dashboard = $('dashboard'), userBox = $('user-box');
    let signups = [];
    let shownFor = null; // user id the dashboard was rendered for

    // Tiny DOM helper — data is only ever set via textContent (feedback is written by anonymous visitors).
    function el(tag, className, text) {
      const n = document.createElement(tag);
      if (className) n.className = className;
      if (text != null) n.textContent = text;
      return n;
    }
    const fmtDate = (iso) => new Date(iso).toLocaleString(undefined, { dateStyle:'medium', timeStyle:'short' });

    // ---------- auth ----------
    sb.auth.onAuthStateChange((_event, session) => {
      // Defer so Supabase calls don't run inside the auth callback.
      setTimeout(() => session ? showDashboard(session) : showLogin(), 0);
    });

    function showLogin() {
      shownFor = null;
      signups = [];
      dashboard.replaceChildren();
      dashboard.hidden = true;
      userBox.hidden = true;
      $('user-email').textContent = '';
      loginView.hidden = false;
    }

    const loginForm = $('login-form');
    const loginStatus = loginForm.querySelector('.form__status');
    loginForm.addEventListener('submit', async (e) => {
      e.preventDefault();
      if (!loginForm.checkValidity()) { loginForm.reportValidity(); return; }
      const button = loginForm.querySelector('button');
      button.disabled = true;
      loginStatus.className = 'form__status';
      loginStatus.textContent = 'Signing in…';
      const { error } = await sb.auth.signInWithPassword({
        email: loginForm.email.value.trim(),
        password: loginForm.password.value,
      });
      button.disabled = false;
      loginForm.password.value = '';
      if (error) {
        loginStatus.className = 'form__status is-error';
        loginStatus.textContent = 'Invalid email or password.';
        return;
      }
      loginStatus.textContent = '';
    });

    $('sign-out').addEventListener('click', () => sb.auth.signOut());

    // ---------- data ----------
    async function fetchAll(table, columns) {
      const PAGE = 1000, rows = [];
      for (let from = 0; ; from += PAGE) {
        const { data, error } = await sb.from(table).select(columns)
          .order('created_at', { ascending:false }).range(from, from + PAGE - 1);
        if (error) throw error;
        rows.push(...data);
        if (data.length < PAGE) return rows;
      }
    }

    function panel(title) {
      const section = el('section', 'admin__panel');
      const head = el('div', 'admin__panel-head');
      const h = el('h2', 'h4', title);
      const count = el('span', 'admin__count', '…');
      h.append(' ', count);
      head.append(h);
      const body = el('div', 'admin__panel-body', 'Loading…');
      section.append(head, body);
      return { section, head, count, body };
    }

    async function showDashboard(session) {
      if (shownFor === session.user.id) return; // token refresh etc.
      shownFor = session.user.id;

      loginView.hidden = true;
      $('user-email').textContent = session.user.email;
      userBox.hidden = false;
      dashboard.replaceChildren();
      dashboard.hidden = false;

      const s = panel('Signups');
      const csvBtn = el('button', 'btn btn--red', 'Download CSV');
      csvBtn.type = 'button';
      csvBtn.disabled = true;
      csvBtn.addEventListener('click', downloadSignupsCsv);
      s.head.append(csvBtn);

      const f = panel('Feedback');
      dashboard.append(s.section, f.section);

      fetchAll('signups', 'email, created_at').then((rows) => {
        if (shownFor !== session.user.id) return;
        signups = rows;
        s.count.textContent = rows.length;
        csvBtn.disabled = rows.length === 0;
        if (!rows.length) { s.body.textContent = 'No signups yet.'; return; }
        const wrap = el('div', 'admin__table-wrap');
        const table = el('table', 'admin__table');
        const thead = el('thead'); const hr = el('tr');
        hr.append(el('th', null, 'Email'), el('th', null, 'Signed up'));
        thead.append(hr);
        const tbody = el('tbody');
        for (const r of rows) {
          const tr = el('tr');
          tr.append(el('td', null, r.email), el('td', 'admin__date', fmtDate(r.created_at)));
          tbody.append(tr);
        }
        table.append(thead, tbody);
        wrap.append(table);
        s.body.replaceChildren(wrap);
      }).catch((err) => { console.error(err); s.count.textContent = ''; s.body.textContent = 'Could not load signups.'; });

      fetchAll('feedback', 'message, email, created_at').then((rows) => {
        if (shownFor !== session.user.id) return;
        f.count.textContent = rows.length;
        if (!rows.length) { f.body.textContent = 'No feedback yet.'; return; }
        const list = el('ul', 'admin__fb-list');
        for (const r of rows) {
          const li = el('li', 'admin__fb');
          const meta = el('div', 'admin__fb-meta');
          meta.append(el('span', null, r.email || 'Anonymous'), el('span', 'admin__date', fmtDate(r.created_at)));
          li.append(el('p', 'admin__fb-msg', r.message), meta);
          list.append(li);
        }
        f.body.replaceChildren(list);
      }).catch((err) => { console.error(err); f.count.textContent = ''; f.body.textContent = 'Could not load feedback.'; });
    }

    // ---------- CSV ----------
    function csvCell(value) {
      let v = String(value ?? '');
      if (/^[=+\-@\t\r]/.test(v)) v = "'" + v; // block spreadsheet formulas
      return '"' + v.replace(/"/g, '""') + '"';
    }

    function downloadSignupsCsv() {
      if (!signups.length) return;
      const lines = [['email', 'created_at'], ...signups.map((r) => [r.email, r.created_at])]
        .map((row) => row.map(csvCell).join(','));
      const blob = new Blob(['﻿' + lines.join('\r\n')], { type:'text/csv;charset=utf-8' });
      const a = el('a');
      a.href = URL.createObjectURL(blob);
      a.download = `signups-${new Date().toISOString().slice(0, 10)}.csv`;
      document.body.append(a);
      a.click();
      a.remove();
      setTimeout(() => URL.revokeObjectURL(a.href), 1000);
    }
  </script>
</body>
</html>
